<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <title>Training Log — Redesign</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      font-family: Inter, -apple-system, system-ui, sans-serif;
      background: #060709;
      color: #F4F5F7;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background:
        radial-gradient(1400px 800px at 10% 0%, rgba(255,91,91,0.07), transparent 70%),
        radial-gradient(1200px 700px at 90% 100%, rgba(94,234,212,0.05), transparent 70%),
        #060709;
    }
    ::-webkit-scrollbar { width: 0; height: 0; }
    button { font-family: inherit; }
    [data-nums] { font-variant-numeric: tabular-nums; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="components/design-system.jsx?v=6"></script>
  <script type="text/babel" src="components/shared-viz.jsx?v=6"></script>
  <script type="text/babel" src="components/sample-data.jsx?v=6"></script>
  <script type="text/babel" src="components/interactions.jsx?v=6"></script>
  <script type="text/babel" src="components/home-variants.jsx?v=6"></script>
  <script type="text/babel" src="components/train-screen.jsx?v=6"></script>
  <script type="text/babel" src="components/active-workout.jsx?v=6"></script>
  <script type="text/babel" src="components/progress-screen.jsx?v=6"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "direction": "hub",
      "accent": "magenta",
      "density": "balanced",
      "showLabels": true,
      "streakPalette": "cyan"
    }/*EDITMODE-END*/;

    const ACCENT_MAP = {
      coral:   { primary: '#FF4D5E', dim: '#C43745', secondary: '#E8C547' },
      magenta: { primary: '#FF3D7F', dim: '#C42863', secondary: '#9BE80A' },
      violet:  { primary: '#B48CFF', dim: '#8C66D4', secondary: '#9BE80A' },
      orange:  { primary: '#FF8A3D', dim: '#CC6A24', secondary: '#9BE80A' },
      white:   { primary: '#FFFFFF', dim: '#B8B8BD', secondary: '#9BE80A' },
      amber:   { primary: '#FFB86B', dim: '#D9924A', secondary: '#FF4D5E' },
      gold:    { primary: '#E8C547', dim: '#B8992E', secondary: '#FF4D5E' },
    };

    const App = () => {
      const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
      const [tab, setTab] = React.useState('home');
      const [screen, setScreen] = React.useState('main'); // main | active | summary
      const [editMode, setEditMode] = React.useState(false);

      // persistence
      React.useEffect(() => {
        const saved = localStorage.getItem('tl-state');
        if (saved) {
          try {
            const { tab, direction, screen: sc } = JSON.parse(saved);
            if (tab) setTab(tab);
            if (direction) setTweaks(t => ({ ...t, direction }));
            if (sc) setScreen(sc);
          } catch {}
        }
      }, []);
      React.useEffect(() => {
        localStorage.setItem('tl-state', JSON.stringify({ tab, direction: tweaks.direction, screen }));
      }, [tab, tweaks.direction, screen]);

      // tweaks host protocol
      React.useEffect(() => {
        const onMsg = (e) => {
          if (e.data?.type === '__activate_edit_mode') setEditMode(true);
          else if (e.data?.type === '__deactivate_edit_mode') setEditMode(false);
        };
        window.addEventListener('message', onMsg);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', onMsg);
      }, []);

      const updateTweak = (key, val) => {
        setTweaks(t => {
          const next = { ...t, [key]: val };
          window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
          return next;
        });
      };

      // override accent globally by mutating TOKENS
      React.useEffect(() => {
        const a = ACCENT_MAP[tweaks.accent] || ACCENT_MAP.coral;
        window.TOKENS.coral = a.primary;
        window.TOKENS.coralDim = a.dim;
      }, [tweaks.accent]);

      const startWorkout = () => setScreen('active');
      const finishWorkout = () => setScreen('summary');
      const closeAll = () => { setScreen('main'); setTab('home'); };

      const renderHome = () => {
        if (tweaks.direction === 'bold') return <HomeBold onStart={startWorkout} onTab={setTab} />;
        if (tweaks.direction === 'hub')  return <HomeHub onStart={startWorkout} onTab={setTab} streakPalette={tweaks.streakPalette} />;
        return <HomeSafe onStart={startWorkout} onTab={setTab} />;
      };

      const renderTab = () => {
        if (tab === 'home') return renderHome();
        if (tab === 'train') return <TrainScreen onActive={startWorkout} />;
        if (tab === 'progress') return <ProgressScreen />;
        return <MoreScreen />;
      };

      return (
        <div style={{
          minHeight: '100vh', display: 'flex', flexDirection: 'column',
          alignItems: 'center', justifyContent: 'center',
          padding: '32px 20px', gap: 18,
        }}>
          {/* header */}
          <div style={{ textAlign: 'center', maxWidth: 560 }}>
            <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: 2, color: '#B48CFF' }}>TRAINING LOG · v2</div>
            <h1 style={{ margin: '8px 0 6px', fontSize: 32, fontWeight: 800, letterSpacing: -1, color: '#F4F5F7' }}>
              Um app de treino que <span style={{ color: '#FF5B5B' }}>se conecta</span>.
            </h1>
            <p style={{ margin: 0, fontSize: 14, color: 'rgba(244,245,247,0.62)', lineHeight: 1.5 }}>
              Três direções para a Home, um fluxo completo de treino ao vivo, e Frequência movida para a Home para fechar o loop <i>Hoje → Treino → Progresso</i>.
            </p>
          </div>

          {/* Direction switcher (always visible — this is the primary exploration) */}
          <div style={{
            display: 'flex', gap: 6, padding: 6, borderRadius: 999,
            background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.08)',
          }}>
            {[
              { id: 'safe', label: 'A · Safe', sub: 'Refinado' },
              { id: 'bold', label: 'B · Bold', sub: 'Editorial' },
              { id: 'hub',  label: 'C · Hub',  sub: 'Experimental' },
            ].map(d => {
              const active = tweaks.direction === d.id;
              return (
                <button key={d.id} onClick={() => { updateTweak('direction', d.id); setTab('home'); setScreen('main'); }}
                  style={{
                    padding: '8px 16px', borderRadius: 999, border: 'none', cursor: 'pointer',
                    background: active ? '#FF5B5B' : 'transparent',
                    color: active ? '#0B0B10' : 'rgba(244,245,247,0.7)',
                    fontSize: 13, fontWeight: 700,
                    display: 'flex', flexDirection: 'column', alignItems: 'center', lineHeight: 1.1, gap: 2,
                  }}>
                  <span>{d.label}</span>
                  <span style={{ fontSize: 9.5, fontWeight: 600, opacity: 0.7, letterSpacing: 0.5 }}>{d.sub}</span>
                </button>
              );
            })}
          </div>

          {/* Phone */}
          <Phone>
            {screen === 'main' && renderTab()}
            {screen === 'active' && <ActiveWorkout onClose={closeAll} onFinish={finishWorkout} />}
            {screen === 'summary' && <WorkoutSummary onClose={closeAll} />}
            {screen === 'main' && <TabBar active={tab} onChange={setTab} />}
          </Phone>

          {/* Context chips (small) */}
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', justifyContent: 'center', maxWidth: 480 }}>
            {[
              tab === 'home' && screen === 'main' && `Toque "Iniciar treino" → abre o logger ao vivo`,
              tab === 'home' && screen === 'main' && `Tab bar navega entre Hoje / Treinar / Progresso / Mais`,
              screen === 'active' && `Marque uma série → dispara timer de descanso automático`,
              screen === 'summary' && `Contribuição visual pro bloco semanal`,
            ].filter(Boolean).map((t, i) => (
              <span key={i} style={{
                fontSize: 11, padding: '6px 10px', borderRadius: 999,
                background: 'rgba(180,140,255,0.1)', color: '#B48CFF',
                border: '1px solid rgba(180,140,255,0.2)', fontWeight: 500,
              }}>{t}</span>
            ))}
          </div>

          {/* Tweaks panel */}
          {editMode && (
            <div style={{
              position: 'fixed', bottom: 20, right: 20, width: 280,
              background: 'rgba(18,22,30,0.92)', borderRadius: 16, padding: 16,
              border: '1px solid rgba(255,255,255,0.1)',
              backdropFilter: 'blur(20px)', zIndex: 1000,
              boxShadow: '0 20px 50px rgba(0,0,0,0.5)',
            }}>
              <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: 1.5, color: '#B48CFF', marginBottom: 14 }}>TWEAKS</div>

              <TweakGroup label="Direção">
                {['safe','bold','hub'].map(d => (
                  <TweakOpt key={d} active={tweaks.direction === d} onClick={() => updateTweak('direction', d)}>
                    {d === 'safe' ? 'Safe' : d === 'bold' ? 'Bold' : 'Hub'}
                  </TweakOpt>
                ))}
              </TweakGroup>

              <TweakGroup label="Cor de destaque">
                {['coral','magenta','violet','orange','white','gold'].map(c => (
                  <button key={c} onClick={() => updateTweak('accent', c)} style={{
                    width: 28, height: 28, borderRadius: 999, border: tweaks.accent === c ? '2px solid #fff' : '2px solid transparent',
                    background: ACCENT_MAP[c].primary, cursor: 'pointer',
                  }} />
                ))}
              </TweakGroup>

              <TweakGroup label="Paleta do Streak">
                {[
                  { id: 'gold', color: '#F5C542', label: 'Ouro' },
                  { id: 'lime', color: '#9BE80A', label: 'Verde' },
                  { id: 'cyan', color: '#4DD4E8', label: 'Azul' },
                ].map(p => (
                  <button key={p.id} onClick={() => updateTweak('streakPalette', p.id)} title={p.label} style={{
                    width: 28, height: 28, borderRadius: 999,
                    border: tweaks.streakPalette === p.id ? '2px solid #fff' : '2px solid transparent',
                    background: p.color, cursor: 'pointer',
                  }} />
                ))}
              </TweakGroup>
            </div>
          )}
        </div>
      );
    };

    const TweakGroup = ({ label, children }) => (
      <div style={{ marginBottom: 12 }}>
        <div style={{ fontSize: 10, fontWeight: 700, color: 'rgba(244,245,247,0.5)', letterSpacing: 0.5, marginBottom: 6 }}>{label}</div>
        <div style={{ display: 'flex', gap: 6 }}>{children}</div>
      </div>
    );
    const TweakOpt = ({ active, onClick, children }) => (
      <button onClick={onClick} style={{
        flex: 1, padding: '7px 10px', borderRadius: 8, border: 'none', cursor: 'pointer',
        background: active ? '#FF5B5B' : 'rgba(255,255,255,0.06)',
        color: active ? '#0B0B10' : 'rgba(244,245,247,0.8)',
        fontSize: 11, fontWeight: 700,
      }}>{children}</button>
    );

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
